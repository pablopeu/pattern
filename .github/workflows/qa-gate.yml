name: QA gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Full quality gate in parallel with Deploy FTP; it does not block publishing.
# Evidence lands as artifacts and failures reach Pablo by email.
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Independent parsers
        run: |
          python3 -m venv .runtime/qa-python
          .runtime/qa-python/bin/pip install -r scripts/qa/requirements.txt
          echo "$GITHUB_WORKSPACE/.runtime/qa-python/bin" >> "$GITHUB_PATH"
      - name: PHP share integration
        run: |
          if command -v php >/dev/null; then
            node scripts/share-php-test.mjs
          else
            echo "PHP no disponible en el runner; integración de publicaciones omitida."
          fi
      - name: Full quality gate
        run: npm run qa:full
      - name: Store QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pattern-qa-${{ github.sha }}
          path: .runtime/qa/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
