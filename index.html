  <body>
    <div id="root"></div>
    <script>
      // Sin flash de tema/idioma: se aplica antes de cargar React (PRD v4.0 §3.6).
      (function () {
        var root = document.documentElement, prefs = { language: 'auto', theme: 'auto', uiMode: 'simple' };
        try {
          var saved = JSON.parse(localStorage.getItem('pattern.experience.v1') || 'null');
          if (saved && typeof saved === 'object') prefs = Object.assign(prefs, saved);
        } catch (e) {}
        var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        root.dataset.theme = prefs.theme === 'light' || prefs.theme === 'dark' ? prefs.theme : dark ? 'dark' : 'light';
        root.dataset.uiMode = prefs.uiMode === 'advanced' ? 'advanced' : 'simple';
        var lang = prefs.language === 'es' || prefs.language === 'en' ? prefs.language : null;
        if (!lang) {
          var list = (navigator.languages || [navigator.language || '']);
          lang = 'en';
          for (var i = 0; i < list.length; i++) {
            var primary = String(list[i] || '').toLowerCase().split('-')[0];
            if (primary === 'es') { lang = 'es'; break; }
            if (primary === 'en') { lang = 'en'; break; }
          }
        }
        root.lang = lang;
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
